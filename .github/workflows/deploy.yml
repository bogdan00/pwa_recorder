name: Deploy StoryTape PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'cuj/**'
      - 'adr/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'cuj/**'
      - 'adr/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Generate deploy version (YYYY_MM_DD_HH_MM UTC)
        id: version
        run: |
          APP_VERSION=$(date -u +"%Y_%m_%d_%H_%M")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying StoryTape version: $APP_VERSION"

      - name: Build production PWA
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/pwa_recorder/' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run parallel CUJ E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Add .nojekyll safeguard
        if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
